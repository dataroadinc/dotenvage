name: Auto Version Bump & Publish

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  bump:
    uses: legra-ai/github-actions/.github/workflows/cargo-auto-version-bump.yml@main
    with:
      crate-name: dotenvage
      match-mode: first-line-prefix
      version-files: |
        Cargo.toml
        Cargo.lock
        npm/package.json
        python/pyproject.toml
        python/uv.lock
        package.json
    secrets: inherit
