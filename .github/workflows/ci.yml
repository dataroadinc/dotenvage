name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Check code formatting
  fmt:
    needs: version-check
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}
      - name: Read formatter pin
        id: formatter
        run: |
          IFS= read -r formatter_toolchain < rustfmt-toolchain || exit 1
          printf 'toolchain=%s\n' "$formatter_toolchain" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.formatter.outputs.toolchain }}
          components: rustfmt
      - name: Check formatting
        run: ./scripts/fmt.sh --check
      - name: Check release workflow contract
        run: python3 -m unittest discover -s tests -p test_release_workflow.py

  # Run clippy linting
  clippy:
    needs: version-check
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""  # Don't override RUSTFLAGS, clippy sets its own
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W missing-docs

  # Run tests
  test:
    needs: version-check
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run tests
        run: cargo test
      - name: Run doc tests
        run: cargo test --doc

  # Run npm tests
  test-npm:
    needs: version-check
    name: Test NPM (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
          cache-dependency-path: npm/pnpm-lock.yaml
      - name: Install Rust (for NAPI build)
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dependencies
        working-directory: npm
        run: pnpm install
      - name: Build NAPI bindings
        working-directory: npm
        run: pnpm run build
      - name: Run npm tests
        working-directory: npm
        run: pnpm test

  # Run Python tests
  test-python:
    needs: version-check
    name: Test Python (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install ${{ matrix.python }}
      - name: Install Rust (for maturin build)
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install dependencies
        working-directory: python
        run: uv sync --dev
      - name: Build and install Python bindings
        working-directory: python
        run: uv run maturin develop
      - name: Run ruff check
        working-directory: python
        run: uv run ruff check .
      - name: Run ruff format check
        working-directory: python
        run: uv run ruff format --check .
      - name: Run Python tests
        working-directory: python
        run: uv run pytest tests/ -v

  # Prepare one revision for all language checks and release artifacts.
  version-check:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_changed: ${{ steps.version.outputs.release }}
      new_version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare validated release revision
        id: version
        uses: legra-ai/github-actions/.github/actions/prepare-cargo-release@main

  # Build all artifacts BEFORE creating release
  # This ensures we don't create a release if builds fail
  build-artifacts:
    name: Build Artifacts
    runs-on: ${{ matrix.platform.os }}
    needs: [fmt, clippy, test, test-npm, test-python, version-check]
    if: needs.version-check.outputs.version_changed == 'true'
    strategy:
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            use_zig: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            use_zig: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.platform.target }}
          cache: false  # Using Swatinem/rust-cache below for custom config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Zig
        if: matrix.platform.use_zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.14.0"

      - name: Install cargo-zigbuild
        if: matrix.platform.use_zig
        run: pip install cargo-zigbuild

      - name: Free Disk Space (Ubuntu)
        if: ${{ matrix.platform.os == 'ubuntu-24.04' || matrix.platform.os == 'ubuntu-24.04-arm' }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false

      # Build CLI binary
      - name: Build CLI binary
        shell: bash
        run: |
          if [ "${{ matrix.platform.use_zig }}" = "true" ]; then
            cargo zigbuild --release --bin dotenvage \
              --target ${{ matrix.platform.target }}.2.28
          else
            cargo build --release --bin dotenvage \
              --target ${{ matrix.platform.target }}
          fi

      - name: Create CLI archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.platform.target }}/release/dotenvage artifacts/
          cd artifacts
          zip dotenvage-${{ matrix.platform.target }}.zip dotenvage
          sha256sum dotenvage-${{ matrix.platform.target }}.zip > dotenvage-${{ matrix.platform.target }}.sha256

      - name: Create CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.platform.target }}/release/dotenvage.exe artifacts/
          cd artifacts
          7z a dotenvage-${{ matrix.platform.target }}.zip dotenvage.exe
          sha256sum dotenvage-${{ matrix.platform.target }}.zip > dotenvage-${{ matrix.platform.target }}.sha256

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform.target }}
          path: |
            artifacts/dotenvage-${{ matrix.platform.target }}.zip
            artifacts/dotenvage-${{ matrix.platform.target }}.sha256
          retention-days: 7
          if-no-files-found: error

      # Build npm NAPI bindings
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install npm dependencies
        working-directory: npm
        run: pnpm install
      - name: Build NAPI bindings
        working-directory: npm
        shell: bash
        run: |
          if [ "${{ matrix.platform.use_zig }}" = "true" ]; then
            TARGET="${{ matrix.platform.target }}"
            ZIG_TARGET="${TARGET/unknown-/}"
            WRAPPER="/tmp/zig-cc-wrapper"
            printf '#!/bin/sh\nexec zig cc -target %s.2.28 "$@"\n' "$ZIG_TARGET" > "$WRAPPER"
            chmod +x "$WRAPPER"
            ENV_TARGET=$(echo "$TARGET" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            export "CARGO_TARGET_${ENV_TARGET}_LINKER=$WRAPPER"
          fi
          pnpm exec napi build \
            --manifest-path ./dotenvage-napi/Cargo.toml \
            --output-dir . \
            --platform \
            --release \
            --target ${{ matrix.platform.target }}
      - name: Upload npm .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-node-files-${{ matrix.platform.target }}
          path: npm/*.node
          retention-days: 7
          if-no-files-found: error

      - name: Verify glibc version requirement
        if: matrix.platform.use_zig
        shell: bash
        run: |
          echo "--- CLI binary ---"
          objdump -T target/${{ matrix.platform.target }}/release/dotenvage \
            | grep -oP 'GLIBC_\K[0-9.]+' | sort -Vu | tail -1
          echo "--- NAPI .node ---"
          for f in npm/*.node; do
            [ -f "$f" ] && objdump -T "$f" \
              | grep -oP 'GLIBC_\K[0-9.]+' | sort -Vu | tail -1
          done

      # Build Python wheels
      # Skip aarch64-pc-windows-msvc: no ARM64 Windows runners, can't cross-compile Python
      - name: Install uv
        if: matrix.platform.target != 'aarch64-pc-windows-msvc'
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        if: matrix.platform.target != 'aarch64-pc-windows-msvc'
        run: uv python install 3.12
      - name: Build Python wheel
        if: matrix.platform.target != 'aarch64-pc-windows-msvc'
        working-directory: python
        shell: bash
        run: |
          ZIG_FLAG=""
          if [ "${{ matrix.platform.use_zig }}" = "true" ]; then
            ZIG_FLAG="--zig"
          fi
          uv run maturin build \
            --release \
            --target ${{ matrix.platform.target }} \
            $ZIG_FLAG \
            --out dist/
      - name: Upload Python wheel artifact
        if: matrix.platform.target != 'aarch64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.platform.target }}
          path: python/dist/*.whl
          retention-days: 7
          if-no-files-found: error

  # Create release ONLY after all builds succeed
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-artifacts, version-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.version-check.outputs.revision }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Tag
        uses: legra-ai/github-actions/.github/actions/tag-tested-release@main
        with:
          version: ${{ needs.version-check.outputs.new_version }}
          revision: ${{ needs.version-check.outputs.revision }}

      - name: Generate Changelog
        uses: legra-ai/github-actions/.github/actions/generate-changelog@main
        with:
          revision: ${{ needs.version-check.outputs.revision }}
          output-file: CHANGELOG_RELEASE.md

      # Download all CLI artifacts
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-artifacts/

      - name: List release artifacts
        run: |
          echo "Release artifacts:"
          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version-check.outputs.new_version }}
          name: v${{ needs.version-check.outputs.new_version }}
          target_commitish: ${{ needs.version-check.outputs.revision }}
          body_path: CHANGELOG_RELEASE.md
          draft: true
          prerelease: false
          files: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✅ Created GitHub release v${{ needs.version-check.outputs.new_version }}"
          echo "📝 https://github.com/legra-ai/dotenvage/releases/tag/v${{ needs.version-check.outputs.new_version }}"

  # Publish all packages after release is created
  publish-all:
    name: Publish All Packages
    runs-on: ubuntu-latest
    needs: [create-release, version-check]
    environment: pypi  # Required for PyPI Trusted Publishing
    permissions:
      contents: write
      id-token: write  # Required for OIDC authentication (npm/PyPI Trusted Publishing)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version-check.outputs.revision }}

      # Setup Rust for crates.io publish
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # Setup Node.js/pnpm for npm publish
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      # Setup Python/uv for PyPI publish
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Python
        run: uv python install 3.12

      # Verify version sync across all packages
      - name: Verify version sync
        run: |
          WORKSPACE_VERSION=$(grep '^\[workspace\.package\]' -A 10 Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NPM_VERSION=$(grep '"version"' npm/package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PYTHON_VERSION=$(grep '^version' python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          UV_LOCK_VERSION=$(awk '/^name = "dotenvage"$/ { getline; if ($1 == "version") { gsub(/"/, "", $3); print $3; exit } }' python/uv.lock)
          ROOT_PACKAGE_VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"\(.*\)".*/\1/')

          echo "Workspace version: $WORKSPACE_VERSION"
          echo "NPM version: $NPM_VERSION"
          echo "Python version: $PYTHON_VERSION"
          echo "uv lock version: $UV_LOCK_VERSION"
          echo "Root package version: $ROOT_PACKAGE_VERSION"

          MISMATCH=0
          if [ "$WORKSPACE_VERSION" != "$NPM_VERSION" ]; then
            echo "❌ NPM version mismatch!"
            MISMATCH=1
          fi
          if [ "$WORKSPACE_VERSION" != "$PYTHON_VERSION" ]; then
            echo "❌ Python version mismatch!"
            MISMATCH=1
          fi
          if [ "$WORKSPACE_VERSION" != "$UV_LOCK_VERSION" ]; then
            echo "❌ uv lock version mismatch!"
            MISMATCH=1
          fi
          if [ "$WORKSPACE_VERSION" != "$ROOT_PACKAGE_VERSION" ]; then
            echo "❌ Root package version mismatch!"
            MISMATCH=1
          fi
          if [ "$MISMATCH" -eq 1 ]; then
            exit 1
          fi
          echo "✅ All versions are in sync: $WORKSPACE_VERSION"

      # Download npm .node files
      - name: Download npm .node file artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: npm-node-files-*
          merge-multiple: true
          path: npm-artifacts/
      - name: Copy .node files to npm directory
        run: |
          find npm-artifacts -name "*.node" -type f -exec cp {} npm/ \;
          echo "Copied .node files to npm/ directory"
          ls -lh npm/*.node
      - name: Install npm dependencies
        working-directory: npm
        run: pnpm install
      - name: Verify npm .node files
        working-directory: npm
        run: |
          echo "Verifying .node files:"
          ls -lh ./*.node
          NODE_COUNT=$(find . -name "*.node" | wc -l | tr -d ' ')
          echo "Found $NODE_COUNT .node file(s)"
          if [ "$NODE_COUNT" -lt 5 ]; then
            echo "Expected at least 5 .node files, found $NODE_COUNT" >&2
            exit 1
          fi

      # Download Python wheel artifacts
      - name: Download Python wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: python-wheels/
      - name: Verify Python wheels
        run: |
          echo "Verifying Python wheels:"
          ls -lh python-wheels/*.whl
          WHEEL_COUNT=$(find python-wheels -name "*.whl" | wc -l | tr -d ' ')
          echo "Found $WHEEL_COUNT wheel file(s)"
          if [ "$WHEEL_COUNT" -lt 5 ]; then
            echo "Expected at least 5 wheels, found $WHEEL_COUNT" >&2
            exit 1
          fi

      - name: Publish to crates.io
        uses: legra-ai/github-actions/.github/actions/publish-tested-crate@main
        with:
          crate: dotenvage
          version: ${{ needs.version-check.outputs.new_version }}
          revision: ${{ needs.version-check.outputs.revision }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # Publish to npm (treats "already published" as success)
      - name: Publish to npmjs.org
        working-directory: npm
        env:
          VERSION: ${{ needs.version-check.outputs.new_version }}
        run: |
          rc=0
          LOG=$(pnpm publish --access public --no-git-checks --provenance --ignore-scripts 2>&1) || rc=$?
          echo "$LOG"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if echo "$LOG" | grep -qE "previously published|cannot publish over|EPUBLISHCONFLICT"; then
            echo "ℹ️  $VERSION already on npm, skipping"
            exit 0
          fi
          exit "$rc"

      # Publish to PyPI (using Trusted Publishing / OIDC)
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-wheels/
          skip-existing: true

      - name: Complete release after all registries succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version-check.outputs.new_version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false

      # Summary
      - name: Publish Summary
        run: |
          VERSION="${{ needs.version-check.outputs.new_version }}"
          echo "🎉 Successfully published all packages for v$VERSION"
          echo ""
          echo "📦 crates.io: https://crates.io/crates/dotenvage/$VERSION"
          echo "📦 npm: https://www.npmjs.com/package/@dotenvage/node/v/$VERSION"
          echo "📦 PyPI: https://pypi.org/project/dotenvage/$VERSION/"
          echo ""
          echo "📚 Documentation: https://docs.rs/dotenvage/$VERSION"
