# Dependabot configuration for automated dependency updates
# Updates are checked daily and merged only after the complete CI workflow.
# See: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # Group all dependency updates into a single PR
    groups:
      all-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
    # Allow both direct and indirect dependencies
    allow:
      - dependency-type: "all"
    # Update to the latest version when possible
    versioning-strategy: "auto"
    # Keep PRs manageable - should only be 1 with grouping enabled
    open-pull-requests-limit: 2
    # Add labels for easier identification
    labels:
      - "dependencies"
      - "automated"
    # Commit message prefix follows conventional commits
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"

  # Workflow changes receive the same validation gate.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    groups:
      compatible:
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    groups:
      compatible:
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
